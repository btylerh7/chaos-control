<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Chaos Control - Home</title>
		<script src="/js/components/SiteHeader.js"></script>
		<link rel="stylesheet" href="styles.css">
		<script src="/js/components/strudel/StrudelButton.js"></script>
		<script src="/js/components/strudel/Strudel.js"></script>
		<script src="https://unpkg.com/@strudel/repl@latest"></script>
		<script src="https://unpkg.com/@strudel/web@latest"></script>
		<script>
		document.addEventListener("DOMContentLoaded", () => {
			initStrudel(() => {
				samples('github:tidalcycles/dirt-samples');

			})
		})
		</script>

	</head>
	<body>
		<div class="main-container">
			<!-- 
				This site makes use of a lot of Web Components to both speed up repetetive writing
				as well as to make more advanced concepts a reality within just plain html pages!
				See documentation: https://developer.mozilla.org/en-US/docs/Web/API/Web_components
				A wonderful tutorial: https://www.youtube.com/watch?v=2I7uX8m0Ta0
			-->
			<site-header></site-header>
			<main>
				<h1>Welcome to My Online Home!</h1>
				<strudel-button>
					Would you like some classic Shadow the Hedgehog background music but written by me with code?
					Of course you do! (Look at the Strudel Showcase for more!)
				</strudel-button>
				<strudel-repl filename="vengeance-is-mine" hidden></strudel-repl>
			</main>

		</div>
	</body>
</html>
