<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Strudel Showcase</title>
		<link rel="stylesheet" href="/styles.css">
		<script src="/js/components/SiteHeader.js"></script>
		<script src="/js/components/strudel/StrudelButton.js"></script>
		<script src="/js/components/strudel/Strudel.js"></script>
		<script src="https://unpkg.com/@strudel/repl@latest"></script>
		<script src="https://unpkg.com/@strudel/web@latest"></script>
		<script>
			document.addEventListener('DOMContentLoaded', () => {
				initStrudel(() => {
					samples('github:tidalcycles/dirt-samples');

				})
				const url = new URL(window.location.href);
				const params = new URLSearchParams(url.search);
				const filename=params.get("song");
				document.querySelector("strudel-repl").setAttribute("filename", filename);
			})
		</script>
	</head>
	<body>
		<div class="main-container">
			<!-- 
				This site makes use of a lot of Web Components to both speed up repetetive writing
				as well as to make more advanced concepts a reality within just plain html pages!
				See documentation: https://developer.mozilla.org/en-US/docs/Web/API/Web_components
				A wonderful tutorial: https://www.youtube.com/watch?v=2I7uX8m0Ta0
			-->
			<site-header></site-header>
			<!--
				Strudel itself has a web component, and this is a web component I made to wrap that one.
				You should be able to see the source by going to the source tab in your devtools and
				looking at js/components/strudel
			-->
			<strudel-button>
				Click into the editor and press <code>Ctrl + Enter</code>
				to start and <code>Ctrl + .</code>
				to stop. Alternatively, use the buttons below.
			</strudel-button>
			<strudel-repl></strudel-repl>
		</div>
	</body>
</html>
